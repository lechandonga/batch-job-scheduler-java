server.port=0

# ---- In-process batch job scheduler configuration ----
# Global cap on QUEUED (incl. retrying) + RUNNING jobs across all tenants.
scheduler.global-queue-capacity=1024
# Global concurrency cap (worker pool size).
scheduler.worker-threads=8
# Dispatcher wake-up interval (ms).
scheduler.tick-millis=20
# Per-tenant submission quota: QUEUED + RUNNING jobs admitted by submit().
scheduler.default-tenant-queued-quota=64
# Per-tenant max concurrently RUNNING jobs.
scheduler.default-tenant-running-quota=2
# Defaults overridable per submission.
scheduler.default-timeout-millis=5000
scheduler.default-max-attempts=3
# Exponential backoff: backoff = min(retry-max-backoff-millis, retry-backoff-millis * 2^(attempt-1)).
scheduler.retry-backoff-millis=200
scheduler.retry-max-backoff-millis=5000
# Aging quantum: each quantum of queue wait boosts effective priority by one level (starvation protection).
scheduler.fairness-quantum-millis=200
# Per-tenant quota overrides (example shape):
# scheduler.tenant-queued-quota.tenant-a=10
# scheduler.tenant-running-quota.tenant-a=2
