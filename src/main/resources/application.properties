server.port=0

# ===== 批量作业调度器配置 =====
# 全局待调度队列容量（QUEUED 作业数上限，不含运行中作业）
scheduler.queue-capacity=1000
# 全局并发执行线程上限（同时 RUNNING 的作业数）
scheduler.worker-threads=8
# 默认租户活跃配额（同一租户 QUEUED+RUNNING 作业总数上限）
scheduler.default-tenant-quota=4
# 单独覆盖租户配额，例如 scheduler.tenant-quotas.tenant-a=2
#scheduler.tenant-quotas.tenant-a=2
# 单次 attempt 默认执行超时
scheduler.default-timeout-millis=5000
# 每个作业默认最大尝试次数（1 = 不重试）
scheduler.default-max-attempts=3
# 失败重试退避：base * 2^(n-1)，并以 max-backoff-millis 为上限
scheduler.base-backoff-millis=100
scheduler.max-backoff-millis=5000
# 优先级老化间隔：每等待该时长，有效优先级 +1，防止低优先级饿死
scheduler.aging-interval-millis=200
# 调度循环空转节拍
scheduler.dispatch-tick-millis=10
